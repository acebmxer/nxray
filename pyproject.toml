[project]
name = "nxray"
version = "0.1.0"
description = "A web interface for monitoring and managing Cisco Nexus switches through NX-API."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "acebmxer" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "cryptography>=43",
    # SSH, only for the role that lets NXray change ports (app/switch_ssh.py).
    "paramiko>=4",
    # QR code on the two-factor setup page (app/totp.py); pure Python.
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F  pyflakes + pycodestyle errors   I  import sorting
# B    bugbear (mutable defaults, etc) UP pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, but show the reason for every skip/xfail rather than hiding them.
addopts = "-ra"
