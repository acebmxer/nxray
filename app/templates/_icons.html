{#- Line icons for the menu, drawn in the text colour. Inline SVG, no script, no style. -#}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "dashboard" -%}<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
{%- elif name == "ports" -%}<rect x="2" y="6" width="20" height="12" rx="1"/><path d="M6 10h2v4H6zM11 10h2v4h-2zM16 10h2v4h-2z"/>
{%- elif name == "neighbors" -%}<circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.3 11l9.4-4.8M7.3 13l9.4 4.8"/>
{%- elif name == "traffic" -%}<path d="M7 20V5M3 9l4-4 4 4"/><path d="M17 4v15M13 15l4 4 4-4"/>
{%- elif name == "history" -%}<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-6"/>
{%- elif name == "alerts" -%}<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>
{%- elif name == "vlans" -%}<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>
{%- elif name == "channels" -%}<path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/>
{%- elif name == "stp" -%}<circle cx="12" cy="4" r="2"/><circle cx="5" cy="20" r="2"/><circle cx="19" cy="20" r="2"/><circle cx="12" cy="13" r="2"/><path d="M12 6v5M10.6 14.4l-4.2 4.2M13.4 14.4l4.2 4.2"/>
{%- elif name == "routing" -%}<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/>
{%- elif name == "protocols" -%}<path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/>
{%- elif name == "security" -%}<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>
{%- elif name == "features" -%}<rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3"/>
{%- elif name == "switch-admin" -%}<rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 7.5h.01M7 16.5h.01"/>
{%- elif name == "config" -%}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>
{%- elif name == "switch" -%}<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
{%- elif name == "users" -%}<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/>
{%- elif name == "activity" -%}<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif name == "settings" -%}<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
{%- elif name == "account" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "restart" -%}<path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/>
{%- elif name == "logout" -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
{%- elif name == "narrow" -%}<path d="M15 18l-6-6 6-6"/>
{%- elif name == "wide" -%}<path d="M9 18l6-6-6-6"/>
{%- elif name == "fold" -%}<path d="M6 9l6 6 6-6"/>
{%- endif -%}
</svg>
{%- endmacro %}

{#- NXray's mark: a switch front with coloured ports and a lit light. -#}
{% macro brand_mark(extra="") -%}
<svg class="brand-mark{% if extra %} {{ extra }}{% endif %}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="bm-body" x="1.5" y="5" width="21" height="14" rx="2"/>
  <rect class="bm-25" x="5" y="9" width="3" height="2.4"/><rect class="bm-10" x="9" y="9" width="3" height="2.4"/>
  <rect class="bm-25" x="13" y="9" width="3" height="2.4"/><rect class="bm-100" x="5" y="12.6" width="3" height="2.4"/>
  <rect class="bm-off" x="9" y="12.6" width="3" height="2.4"/><rect class="bm-25" x="13" y="12.6" width="3" height="2.4"/>
  <circle class="bm-led" cx="19" cy="10.2" r="1"/>
</svg>
{%- endmacro %}
